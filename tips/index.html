<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tips per mail | FitCoach Mirlande</title>
<meta name="description" content="Meld je aan voor tips, recepten en aanbiedingen van FitCoach Mirlande per mail.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/poppins-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/poppins-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/poppins-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;color:#142836;background:#f2f8f8;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:clamp(32px,8vw,72px) 16px}
.kaart{background:#fff;border:1px solid #d9e8ea;border-radius:20px;padding:clamp(24px,5vw,40px)}
.kaart:focus{outline:none}
.logo{display:inline-block;font-size:20px;font-weight:700;color:#142836;text-decoration:none;margin-bottom:20px}
h1{font-size:24px;line-height:1.3;margin:0 0 12px}
p{margin:0 0 14px}
ul{margin:0 0 18px;padding-left:20px}
li{margin:0 0 4px}
.klein{font-size:14px;color:#3d5f63}
label{display:block;font-weight:600;font-size:15px;margin:14px 0 4px}
input[type=text],input[type=email],input[type=tel]{box-sizing:border-box;width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid #b9d3d6;border-radius:12px;background:#fff;color:#142836}
input:focus{outline:3px solid #0e7580;outline-offset:1px;border-color:#0e7580}
fieldset{border:0;margin:14px 0 0;padding:0}
legend{font-weight:600;font-size:15px;margin-bottom:4px;padding:0}
.keuze{display:flex;gap:16px;flex-wrap:wrap}
.keuze label,.vinkje{font-weight:400;font-size:16px;margin:0;display:flex;gap:8px;align-items:flex-start}
.vinkje{margin-top:18px}
.vinkje input,.keuze input{margin-top:6px;width:18px;height:18px;flex:none;accent-color:#0e7580}
button{font:inherit;font-weight:600;font-size:17px;background:#0e7580;color:#fff;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;margin:20px 0 12px}
button[disabled]{opacity:.6;cursor:default}
.fout{color:#b3261e;font-size:15px;margin:8px 0 0;min-height:1em}
.knoppen{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.knoppen a{display:inline-block;background:#fff;color:#0e7580;border:1.5px solid #0e7580;border-radius:999px;padding:10px 20px;font-size:16px;font-weight:600;text-decoration:none}
a{color:#0e7580}
button:focus-visible,a:focus-visible{outline:3px solid #142836;outline-offset:2px}
</style>
</head>
<body>
<main>
<a class="logo" href="/">FitCoach Mirlande</a>
<div class="kaart" id="kaart" tabindex="-1">
  <h1>Tips en recepten in je mail</h1>
  <p>Af en toe een praktische tip, een makkelijk recept of een aanbieding van mij. Geen dagelijkse spam, en afmelden kan altijd onderaan elke mail.</p>
  <form id="form" novalidate>
    <label for="naam">Je voornaam</label>
    <input type="text" id="naam" name="naam" autocomplete="given-name" required>
    <label for="email">Je e-mailadres</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
    <p class="fout" id="fout" role="alert"></p>
    <button type="submit">Ja, stuur me tips</button>
    <p class="klein">Door je aan te melden geef je toestemming om je deze mails te sturen. Lees ook mijn <a href="https://drive.google.com/file/d/19xrLmwKiqtJJMl2PzHzuhKj-n2Kn9Sa9/view" target="_blank" rel="noopener">privacyverklaring</a>.</p>
  </form>
</div>
</main>
<script>
(function () {
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbxODlnLgRxBaoKyf_BtN9MAQGblBalcwOuvrIgy1JIBCer6H0fvJejjCNY9IT6y9Qmf/exec";
  // Laposta: pas hier aan als er een algemene nieuwsbrieflijst komt (ook in /cadeau/).
  var LAPOSTA = { a: 'pmnqjip8ww', l: 'qo2wkrn8en', email: 'I0Jda6us8D', naam: 'S5HcfZFcsV' };
  var form = document.getElementById('form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var fout = document.getElementById('fout');
    var naam = form.naam.value.trim(), email = form.email.value.trim();
    if (!naam) { fout.textContent = 'Vul je voornaam in.'; form.naam.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fout.textContent = 'Vul een geldig e-mailadres in.'; form.email.focus(); return; }
    fout.textContent = '';
    var btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Even geduld…';
    var payload = { naam: naam, email: email, doel: 'Aanmelding tips per mail',
      toestemming: 'JA: aangemeld via mirlande.nl/tips op ' + new Date().toLocaleString('nl-NL'), bron: 'tips' };
    var klaar = function () {
      var kaart = document.getElementById('kaart');
      kaart.innerHTML = '<h1>Top, ' + naam.split(' ')[0].replace(/[<>&"]/g, '') + ', je staat erop!</h1><p>Je hoort binnenkort van me. Afmelden kan altijd onderaan elke mail.</p><p><a href="/">Terug naar de website</a></p>';
      kaart.focus();
    };
    var lp = new URLSearchParams();
    lp.append('next', ''); lp.append('a', LAPOSTA.a); lp.append('l', LAPOSTA.l);
    lp.append(LAPOSTA.email, email); lp.append(LAPOSTA.naam, naam);
    try { fetch('https://met-mirlande-in-balans.email-provider.eu/subscribe/post/index.php', { method: 'POST', mode: 'no-cors', body: lp }); } catch (x) {}
    fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(klaar, klaar);
  });
})();
</script>
</body>
</html>
