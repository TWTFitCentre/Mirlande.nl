<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blijf op de hoogte | FitCoach Mirlande</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/poppins-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/poppins-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/poppins-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;color:#142836;background:#f2f8f8;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:clamp(32px,8vw,72px) 16px}
.kaart{background:#fff;border:1px solid #d9e8ea;border-radius:20px;padding:clamp(24px,5vw,40px)}
.logo{display:inline-block;font-size:20px;font-weight:700;color:#142836;text-decoration:none;margin-bottom:20px}
h1{font-size:24px;line-height:1.3;margin:0 0 12px}
p{margin:0 0 14px}
.klein{font-size:14px;color:#3d5f63}
button{font:inherit;font-weight:600;font-size:17px;background:#0e7580;color:#fff;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;margin:8px 0 16px}
.kaart:focus{outline:none}
button[disabled]{opacity:.6;cursor:default}
a{color:#0e7580}
button:focus-visible,a:focus-visible{outline:3px solid #142836;outline-offset:2px}
</style>
</head>
<body>
<main>
<a class="logo" href="/">FitCoach Mirlande</a>
<div class="kaart" id="kaart" tabindex="-1">
  <h1>Ook na december tips en recepten?</h1>
  <p>Wil je na de challenge tips, recepten en aanbiedingen van me per mail ontvangen?</p>
  <button type="button" id="ja">Ja, ik wil blijven</button>
  <p class="klein">Afmelden kan altijd, onderaan elke mail. Lees ook mijn <a href="https://drive.google.com/file/d/19xrLmwKiqtJJMl2PzHzuhKj-n2Kn9Sa9/view" target="_blank" rel="noopener">privacyverklaring</a>.</p>
</div>
</main>
<script>
(function () {
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbxODlnLgRxBaoKyf_BtN9MAQGblBalcwOuvrIgy1JIBCer6H0fvJejjCNY9IT6y9Qmf/exec";
  var kaart = document.getElementById('kaart');
  var token = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
  // Code uit de adresbalk halen, zodat hij niet in de geschiedenis of bij doorsturen blijft staan
  try { history.replaceState(null, '', location.pathname); } catch (x) {}
  var melding = function (kop, tekst) {
    kaart.innerHTML = '<h1>' + kop + '</h1><p>' + tekst + '</p>';
    kaart.focus();
  };
  var fout = function () {
    melding('Dat lukte helaas niet', 'Deze link werkt niet (meer). Stuur me een appje op 06-57327138 of antwoord op mijn mail, dan zet ik je er zelf op.');
  };
  if (!/^[a-f0-9]{32}$/.test(token)) { fout(); return; }

  // Pas bij een klik aanmelden: mailscanners openen links vaak automatisch.
  document.getElementById('ja').addEventListener('click', function () {
    this.disabled = true; this.textContent = 'Even geduld…';
    fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ actie: 'blijf', token: token }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok || !d.email) { fout(); return; }
        // Laposta-lijst "December-challenge 2026": alleen na deze bewuste klik
        var lp = new URLSearchParams();
        lp.append('next', ''); lp.append('a', 'pmnqjip8ww'); lp.append('l', 'qo2wkrn8en');
        lp.append('I0Jda6us8D', d.email); lp.append('S5HcfZFcsV', d.naam || '');
        var klaar = function () {
          var naam = String(d.naam || '').split(' ')[0].replace(/[<>&"]/g, '');
          melding('Top' + (naam ? ', ' + naam : '') + ', je staat erop!', 'Je hoort na de challenge van me. Afmelden kan altijd onderaan elke mail.');
        };
        fetch('https://met-mirlande-in-balans.email-provider.eu/subscribe/post/index.php', { method: 'POST', mode: 'no-cors', body: lp }).then(klaar, klaar);
      })
      .catch(fout);
  });
})();
</script>
</body>
</html>
